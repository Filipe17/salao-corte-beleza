<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belezza — Sistema de Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/main.css" />
  <link rel="stylesheet" href="static/css/components.css" />
  <link rel="stylesheet" href="static/css/pages.css" />
  <script>
    if (!sessionStorage.getItem('belezza_token') && !sessionStorage.getItem('belezza_user')) {
      window.location.replace('/login.html');
    }
    function logout() {
      sessionStorage.removeItem('belezza_token');
      sessionStorage.removeItem('belezza_user');
      window.location.replace('/login.html');
    }
  </script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">✦</div>
      <span class="brand-name">Belezza</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="agenda">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Agenda</span>
        <span class="nav-badge">8</span>
      </a>
      <a href="#" class="nav-item" data-page="atendimento">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        <span>Atendimento</span>
      </a>
      <a href="#" class="nav-item" data-page="pdv">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>PDV / Vendas</span>
      </a>

      <div class="nav-section-label">Cadastros</div>
      <a href="#" class="nav-item" data-page="clientes">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Clientes</span>
      </a>
      <a href="#" class="nav-item" data-page="profissionais">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profissionais</span>
      </a>
      <a href="#" class="nav-item" data-page="servicos">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>Serviços</span>
      </a>

      <div class="nav-section-label">Gestão</div>
      <a href="#" class="nav-item" data-page="estoque">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
        <span>Estoque</span>
        <span class="nav-badge alert">3</span>
      </a>
      <a href="#" class="nav-item" data-page="financeiro">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Financeiro</span>
      </a>
      <a href="#" class="nav-item" data-page="relatorios">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Relatórios</span>
      </a>
      <a href="#" class="nav-item nav-item-parent" id="navConfiguracoes" onclick="toggleConfigMenu(event)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M12 2a10 10 0 000 20"/></svg>
        <span>Configurações</span>
        <svg class="nav-arrow" id="configArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-left:auto;transition:transform 0.2s"><polyline points="6 9 12 15 18 9"/></svg>
      </a>
      <div class="nav-submenu" id="configSubmenu">
        <a href="#" class="nav-subitem" data-config="usuarios" onclick="navigateConfig('usuarios',event)">
          <span class="nav-subdot">•</span> Usuários
        </a>
        <a href="#" class="nav-subitem" data-config="dados" onclick="navigateConfig('dados',event)">
          <span class="nav-subdot">•</span> Dados do Salão
        </a>
        <a href="#" class="nav-subitem" data-config="horarios" onclick="navigateConfig('horarios',event)">
          <span class="nav-subdot">•</span> Horários
        </a>
        <a href="#" class="nav-subitem" data-config="whatsapp" onclick="navigateConfig('whatsapp',event)">
          <span class="nav-subdot">•</span> WhatsApp
        </a>
      </div>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar">A</div>
      <div class="user-info">
        <span class="user-name">Admin</span>
        <span class="user-role">Gerente</span>
      </div>
      <button onclick="logout()" title="Sair" style="margin-left:auto;background:rgba(255,255,255,0.08);border:none;border-radius:8px;padding:7px;cursor:pointer;color:rgba(255,255,255,0.5);display:flex;align-items:center;transition:all 0.15s;" onmouseover="this.style.background='rgba(239,68,68,0.2)';this.style.color='#fca5a5'" onmouseout="this.style.background='rgba(255,255,255,0.08)';this.style.color='rgba(255,255,255,0.5)'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- Overlay mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main content -->
  <main class="main" id="main">
    <!-- Topbar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="pageTitle">Dashboard</div>

      <!-- Busca -->
      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar..." id="topbarSearchInput" />
      </div>

      <div class="topbar-actions">
        <!-- Sino -->
        <button class="topbar-btn" id="notifBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-badge">3</span>
        </button>

        <!-- Usuário -->
        <div class="topbar-user" id="topbarUser">
          <div class="topbar-user-avatar" id="topbarAvatar">A</div>
          <div class="topbar-user-info">
            <span class="topbar-user-name" id="topbarUserName">Administrador</span>
            <span class="topbar-user-role" id="topbarUserRole">Admin</span>
          </div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="color:var(--gray-400)"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <div class="page-content" id="pageContent">
      <!-- Pages are injected here by JS -->
    </div>
  </main>

  <!-- Modals container -->
  <div id="modals"></div>

  <!-- Scripts -->
  <script src="static/js/data.js"></script>
  <script src="static/js/components.js"></script>
  <script src="static/js/pages.js"></script>
  <script src="static/js/app.js"></script>
  <script src="static/js/api.js"></script>
  <script>
    // Preencher dados do usuário logado na topbar
    try {
      const u = JSON.parse(sessionStorage.getItem('belezza_user') || '{}');
      if (u.nome) {
        document.getElementById('topbarUserName').textContent = u.nome;
        document.getElementById('topbarAvatar').textContent   = u.nome[0].toUpperCase();
      }
      if (u.role) {
        const roles = { gerente:'Gerente', administrador:'Administrador', profissional:'Profissional', recepcionista:'Recepcionista', caixa:'Caixa' };
        document.getElementById('topbarUserRole').textContent = roles[u.role] || u.role;
      }
    } catch(e) {}
  </script>
</body>
</html>
